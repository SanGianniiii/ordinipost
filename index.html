  <style>
    /* STILI ORIGINALI APP */
    body {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(to right, #e8f5e9, #c8e6c9);
      margin: 0;
      padding: 1rem;

    header {
      display: flex;
      align-items: center;

      justify-content: center;

    }
    header img { width: 60px; height: 60px; object-fit: contain; }
    h2 { margin: 0; font-size: 1.5rem; color: #2e7d32; }

    select, input[type="number"], input[type="text"], input[type="password"], button {
      width: 100%;
      padding: 0.8rem;
      margin-top: 0.5rem;

    label { font-weight: bold; color: #2e7d32; display: block; margin-top: 1rem; }

    .table-wrapper {

      border-radius: 8px;
      background-color: white;
      box-shadow: 0 2px 8px rgba(0, 128, 0, 0.15);

    table { width: 100%; border-collapse: collapse; table-layout: fixed; }

    th, td {

    .col-prod { width: 30%; text-align: left; padding-left: 10px; color: #2e7d32; font-weight: bold; }
    .col-disp { width: 15%; }
    .col-qta { width: 20%; }
    .col-nota { width: 35%; }

    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); display: none; justify-content: center;

    .modal-content-box {

    #status-message {
      position: fixed; top: 50%; left: 50%;

      border-radius: 15px; color: white; font-weight: bold;

    .status-error { background-color: #d32f2f; }

    .card-persona h4 { margin: 0 0 10px 0; color: #2e7d32; border-bottom: 2px solid #2e7d32; padding-bottom: 5px; }

    button { background-color: #2e7d32; color: white; border: none; font-weight: bold; margin-top: 1rem; cursor: pointer; transition: background 0.3s; }

    /* STILI ADMIN PANEL */

    .sortable-list { list-style: none; padding: 0; margin: 0; }

    .danger-badge {

    .tabs {

    .tab-btn {

    /* TABELLA ADMIN - ottimizzata per smartphone (colonne a misura di contenuto + scroll orizzontale) */
    .admin-table { table-layout: auto; }
    .admin-table th, .admin-table td {

    @media (max-width: 600px) {
      body { padding: 0.5rem; }

  </style>
  <style media="print">

    /* Il modal è "position: fixed" a schermo intero: in stampa questo genera pagine

  <!-- SDK FIREBASE v10 MODULARE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, onSnapshot, doc, getDoc, runTransaction, getDocs, query, where, serverTimestamp, setDoc, deleteDoc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

    // ⚙️ CONFIGURAZIONE FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyAY8l_GGRWPWi5BFpirUMXd2JN0MVZZpYM",
      authDomain: "ordinipost-fcc7f.firebaseapp.com",
      projectId: "ordinipost-fcc7f",
      storageBucket: "ordinipost-fcc7f.firebasestorage.app",
      messagingSenderId: "363847145933",
      appId: "1:363847145933:web:d1590848833eb147590c84",
      measurementId: "G-V50YGPTVM4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ⚙️ SETUP SERVICE WORKER E NOTIFICHE AL CARICAMENTO
    let messaging = null;
    let serviceWorkerReady = false;
    let swRegistration = null;

    async function setupServiceWorker() {
      try {
        if (!('serviceWorker' in navigator)) {
          console.log('Service Worker non supportati');
          return;
        }
        
        await navigator.serviceWorker.register('./firebase-messaging-sw.js', { scope: '/' });
        // Aspetta che il Service Worker sia davvero ATTIVO, non solo registrato
        swRegistration = await navigator.serviceWorker.ready;
        console.log('Service Worker attivo:', swRegistration);
        serviceWorkerReady = true;
        
        // Ora configura la messaging
        try {
          messaging = getMessaging(app);
          
          // Ascolta i messaggi mentre l'app è aperta
          onMessage(messaging, (payload) => {
            console.log('Messaggio ricevuto:', payload);
            mostraStatus(`🔔 ${payload.data?.title || "Notifica"}: ${payload.data?.body || ""}`);
          });
          
          console.log('Firebase Messaging inizializzato');
        } catch(e) {
          console.error('Errore inizializzazione messaging:', e);
        }
      } catch(e) {
        console.error('Errore registrazione Service Worker:', e);
      }
    }

    // Chiama al caricamento pagina
    window.addEventListener('load', setupServiceWorker);

    let prodottiGlobal = [];

    // Mostra un messaggio stilizzato
    window.mostraStatus = function(messaggio, isError = false) {
      const statusBox = document.getElementById("status-message");
      statusBox.innerText = (isError ? "❌ " : "✅ ") + messaggio;
      statusBox.className = isError ? "status-error" : "status-success";
      statusBox.style.display = "block";
      setTimeout(() => statusBox.style.display = "none", isError ? 3500 : 2500);
    };

    // Prezzo letto direttamente dal prodotto nel database (campo "prezzo"), non più da parole chiave
    window.getPrezzo = (nomeProdotto) => {
      const pObj = prodottiGlobal.find(x => x.tipo === nomeProdotto);
      return pObj && pObj.prezzo ? Number(pObj.prezzo) : 0;
    };

    // ⭐ ASCOLTO ORDINE PERSONALIZZATO DAI PRODOTTI
    onSnapshot(collection(db, "prodotti"), (snapshot) => {
      prodottiGlobal = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      // Ordina secondo l'array 'ordine' se esiste
      const configDoc = snapshot.docs.find(d => d.id === "_config");
      if (configDoc?.data()?.ordine) {
        const ordineArray = configDoc.data().ordine;
        prodottiGlobal.sort((a, b) => {
          const idxA = ordineArray.indexOf(a.id);
          const idxB = ordineArray.indexOf(b.id);
          return (idxA === -1 ? 9999 : idxA) - (idxB === -1 ? 9999 : idxB);
        });
      }
      renderizzaTabellaPrincipale();
    });

    function renderizzaTabellaPrincipale() {
      let html = `<div class="table-wrapper"><table><thead><tr><th class="col-prod">Prodotto</th><th class="col-disp">Disp.</th><th class="col-qta">Qtà</th><th class="col-nota">Nota</th></tr></thead><tbody>`;
      
      prodottiGlobal.forEach((p) => {
        if (p.id === "_config") return; // Salta il documento di config
        
        const isEsaurito = p.giacenza <= 0;
        const isWarning = !isEsaurito && p.giacenza <= 5;
        
        html += `<tr style="${isEsaurito ? 'background-color: #f9f9f9; color: #999;' : isWarning ? 'background-color: #fff3e0;' : ''}">
                  <td class="col-prod">${p.tipo}</td>
                  <td class="col-disp">${p.giacenza}</td>
                  <td class="col-qta">
                    ${!isEsaurito 
                      ? `<input type="number" id="qta-${p.id}" min="0" max="${p.giacenza}" placeholder="0">` 
                      : `<span style="color:#d32f2f; font-weight:bold; font-size:0.8rem;">SOLD OUT</span>`
                    }
                  </td>
                  <td class="col-nota">
                    <input type="text" id="nota-${p.id}" placeholder="${isEsaurito ? '' : 'Es: Mario'}" ${isEsaurito ? 'disabled style="background:#f2f2f2; border:none;"' : ''}>
                  </td>
                 </tr>`;
      });
      
      html += `</tbody></table></div>`;
      document.getElementById("lista-prodotti").innerHTML = html;
    }

    // SISTEMA DI NOTIFICHE MIGLIORATO
    // Controlla se il cambio di giacenza (vecchia -> nuova) deve generare una notifica.
    // Le soglie 25 e 15 avvisano solo quando vengono "attraversate" scendendo.
    // Da 10 in giù avvisa ad OGNI diminuzione. Se la giacenza risale sopra una soglia
    // e poi ridiscende, la soglia può riattivarsi (nessuno stato salvato, si confrontano
    // sempre i valori reali prima/dopo).
    function calcolaNotificaGiacenza(nomeProdotto, vecchia, nuova) {
      if (nuova >= vecchia) return null; // nessuna diminuzione, nessuna notifica

      if (nuova <= 0) {
        return { titolo: `Prodotto Esaurito: ${nomeProdotto}`, corpo: `${nomeProdotto} non è più disponibile!` };
      }
      if (nuova <= 10) {
        return { titolo: `⚠️ Solo ${nuova} pezzi rimasti!`, corpo: `${nomeProdotto} sta per terminare!` };
      }
      if (vecchia >= 15 && nuova < 15) {
        return { titolo: `⚠️ ${nomeProdotto} sotto i 15 pezzi`, corpo: `Rimasti ${nuova} pezzi.` };
      }
      if (vecchia >= 25 && nuova < 25) {
        return { titolo: `⚠️ ${nomeProdotto} sotto i 25 pezzi`, corpo: `Rimasti ${nuova} pezzi.` };
      }
      return null;
    }

    // Funzione per inviare notifiche via Firebase Cloud Messaging
    window.inviaPushNotifica = async function(titolo, corpo) {
      try {
        const risposta = await fetch('/.netlify/functions/notify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            secret: 'k9Xz2mQ7pL4wR8vT1nC6bY3',
            title: titolo,
            body: corpo
          })
        });
        const dati = await risposta.json();
        console.log(`📢 Notifica inviata: ${titolo} - ${corpo}`, dati);
      } catch(e) {
        console.error('Errore invio notifica:', e);
      }
    };

    // 2. CONFERMA E SCRITTURA ORDINE TRAMITE TRANSAZIONE ATOMICA (CORRETTA)
    window.eseguiOperazioneBackend = async function() {
      if (!window.payloadTemporaneo || window.payloadTemporaneo.length === 0) return;
      document.getElementById("modal").style.display = "none";

      try {
        await runTransaction(db, async (transaction) => {
          
          // FASE 1: Esegui TUTTI i READ (Letture) e controlli prima
          const operazioniPronte = [];

          for (const item of window.payloadTemporaneo) {
            const prodRef = doc(db, "prodotti", item.prodottoId);
            const prodDoc = await transaction.get(prodRef);

            if (!prodDoc.exists()) throw new Error(`Prodotto ${item.prodotto} non trovato!`);
            const datiProd = prodDoc.data();
            const giacenzaAttuale = datiProd.giacenza;

            if (giacenzaAttuale < item.quantita) {
              throw new Error(`Disponibilità insufficiente per ${item.prodotto}! Rimasti: ${giacenzaAttuale}`);
            }

            operazioniPronte.push({
              prodRef,
              datiProd,
              item,
              giacenzaAttuale
            });
          }

          // FASE 2: Esegui TUTTI i WRITE (Scritture) dopo le letture
          const notificheDaInviare = [];

          // Raggruppa le operazioni per prodottoId: se più persone ordinano lo
          // stesso prodotto, Firestore deve ricevere UN SOLO transaction.update
          // per quel documento (altrimenti l'ultima chiamata sovrascrive le
          // precedenti e la giacenza viene scalata solo dell'ultima quantità).
          const aggregatiPerProdotto = new Map();
          for (const op of operazioniPronte) {
            const chiave = op.item.prodottoId;
            if (!aggregatiPerProdotto.has(chiave)) {
              aggregatiPerProdotto.set(chiave, {
                prodRef: op.prodRef,
                datiProd: op.datiProd,
                giacenzaAttuale: op.giacenzaAttuale,
                totaleQuantita: 0,
                nomeProdotto: op.item.prodotto
              });
            }
            aggregatiPerProdotto.get(chiave).totaleQuantita += op.item.quantita;
          }

          // Un solo update per prodotto, con la somma totale delle quantità richieste
          for (const agg of aggregatiPerProdotto.values()) {
            const nuovaGiacenza = agg.giacenzaAttuale - agg.totaleQuantita;

            transaction.update(agg.prodRef, {
              giacenza: nuovaGiacenza,
              ordinati: (agg.datiProd.ordinati || 0) + agg.totaleQuantita
            });

            const notif = calcolaNotificaGiacenza(agg.nomeProdotto, agg.giacenzaAttuale, nuovaGiacenza);
            if (notif) notificheDaInviare.push(notif);
          }

          // Le prenotazioni restano individuali: una per ogni persona/riga inserita
          for (const op of operazioniPronte) {
            const prenRef = doc(collection(db, "prenotazioni"));
            transaction.set(prenRef, {
              nome: op.item.nome,
              prodotto: op.item.prodotto,
              prodottoId: op.item.prodottoId,
              quantita: op.item.quantita,
              nota: op.item.nota,
              data: serverTimestamp()
            });
          }

          // Salva le notifiche da inviare fuori dalla transazione (non si può fare fetch dentro)
          window._notificheInSospeso = notificheDaInviare;
        });

        // Reset input form
        document.querySelectorAll('input[type="number"], input[type="text"]').forEach(i => i.value = "");
        
        mostraStatus("ORDINE CONFERMATO");
        
        // Invia le notifiche di soglia calcolate durante la transazione
        (window._notificheInSospeso || []).forEach(n => inviaPushNotifica(n.titolo, n.corpo));
        window._notificheInSospeso = [];

      } catch (e) {
        mostraStatus("ERRORE: " + e.message, true);
      }
    };

    // 3. MOSTRAMO IL RIEPILOGO DELLA FAMIGLIA
    window.mostraRiepilogoPrenotazioni = async function() {
      const fam = document.getElementById("nome").value;
      if (!fam) return mostraStatus("Seleziona una famiglia!", true);

      const q = query(collection(db, "prenotazioni"), where("nome", "==", fam));
      const snapshot = await getDocs(q);

      const riepilogoMap = {};
      let totalePezzi = 0;
      let totaleEuro = 0;

      snapshot.forEach((doc) => {
        const d = doc.data();
        riepilogoMap[d.prodotto] = (riepilogoMap[d.prodotto] || 0) + d.quantita;
      });

      let html = `<div style="background:#e8f5e9; padding:10px; border-radius:8px; margin-bottom:15px; border: 1px solid #a5d6a7;"><strong>${fam}</strong></div>`;
      html += `<div class="table-wrapper"><table style="width:100%; font-size:1.1rem;"><tr style="background:#2e7d32; color:white;"><th style="text-align:left; padding:12px;">Prodotto</th><th style="width:30%;">Qtà</th></tr>`;

      for (const [prod, qta] of Object.entries(riepilogoMap)) {
        if (qta > 0) {
          totalePezzi += qta;
          totaleEuro += (qta * window.getPrezzo(prod));
          html += `<tr><td style="text-align:left; padding:12px;">${prod}</td><td style="font-weight:bold; font-size:1.3rem;">${qta}</td></tr>`;
        }
      }

      html += `</table></div><h3 style="text-align:right; color:#2e7d32;">Totale: € ${totaleEuro}</h3>
               <button class="btn-dark" onclick="mostraDettaglioPerPersone()">Dettaglio per Singola Persona</button>`;

      document.getElementById("contenuto-riepilogo").innerHTML = html;
      document.getElementById("modal-riepilogo").style.display = "flex";
    };

    // 4. DETTAGLIO PER PERSONA CON VARIAZIONE (+ / -)
    window.mostraDettaglioPerPersone = async function() {
      document.getElementById("modal-riepilogo").style.display = "none";
      const fam = document.getElementById("nome").value;
      const q = query(collection(db, "prenotazioni"), where("nome", "==", fam));
      const snapshot = await getDocs(q);

      const personeMap = {};
      snapshot.forEach(doc => {
        const d = doc.data();
        const notaOriginale = (d.nota || "").trim();
        const chiave = notaOriginale ? notaOriginale.toLowerCase() : "generale";
        if (!personeMap[chiave]) {
          personeMap[chiave] = { label: notaOriginale ? capitalizzaNome(notaOriginale) : "Generale", prodotti: {} };
        }
        personeMap[chiave].prodotti[d.prodotto] = (personeMap[chiave].prodotti[d.prodotto] || 0) + d.quantita;
      });

      let html = "";
      for (const { label: persona, prodotti } of Object.values(personeMap)) {
        const prodottiConGiacenza = Object.entries(prodotti).filter(([_, qta]) => qta > 0);
        if (prodottiConGiacenza.length === 0) continue;

        let totPers = 0;
        html += `<div class="card-persona"><h4>👤 ${persona}</h4><div class="table-wrapper"><table style="width:100%;"><tr style="font-size:0.8rem; background:#f0f0f0;"><th style="color:black; background:#eee; text-align:left;">Prodotto</th><th style="color:black; background:#eee; width:15%;">Att.</th><th style="color:green; background:#eee; width:20%;">+</th><th style="color:red; background:#eee; width:20%;">-</th></tr>`;
        
        for (const [prod, qta] of prodottiConGiacenza) {
          totPers += (qta * window.getPrezzo(prod));
          const pObj = prodottiGlobal.find(x => x.tipo === prod);
          const pId = pObj ? pObj.id : prod;
          html += `<tr><td style="text-align:left;">${prod}</td><td><strong>${qta}</strong></td>
                   <td><input type="number" class="in-add" data-pers="${persona}" data-prod="${prod}" data-id="${pId}" value="0" min="0"></td>
                   <td><input type="number" class="in-sub" data-pers="${persona}" data-prod="${prod}" data-id="${pId}" data-current="${qta}" value="0" min="0" max="${qta}"></td></tr>`;
        }
        html += `</table></div><div style="text-align:right; margin-top:10px; font-weight:bold; color:#2e7d32;">Parziale: € ${totPers}</div></div>`;
      }

      document.getElementById("contenuto-dettaglio").innerHTML = html || "Nessun dato trovato per questa famiglia.";
      document.getElementById("modal-dettaglio-persone").style.display = "flex";
    };

    // 5. ATTIVAZIONE NOTIFICHE PUSH DISPOSITIVO
    window.attivaNotifichePush = async function() {
      if(!messaging && !serviceWorkerReady) return mostraStatus("Le notifiche non sono supportate su questo browser.", true);
      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          // Segna SUBITO il permesso come concesso: se qualcosa fallisce dopo
          // (token, scrittura su Firestore, rete...) il bottone non deve ricomparire,
          // perché il permesso del browser è comunque già stato dato.
          localStorage.setItem("notificheAbilitate", "1");

          if (messaging) {
            try {
              const token = await getToken(messaging, { 
                vapidKey: "BJnvFe-amLgnp89cNI2k1XAmMw5cMvy9yzEMhIAGb9pwHlRCEUKQWmkKyNnBeo3TtDVgToa6Le2daJT4RzgX9u0",
                serviceWorkerRegistration: swRegistration
              });

              await setDoc(doc(db, "admin_tokens", token), { token: token, data: serverTimestamp() });
              mostraStatus("Dispositivo registrato per le Notifiche Push!");
            } catch (tokenErr) {
              console.error('Errore registrazione token:', tokenErr);
              mostraStatus("Notifiche abilitate, ma la registrazione del dispositivo non è riuscita: " + tokenErr.message, true);
            }
          } else {
            mostraStatus("Service Worker pronto! Notifiche abilitate.");
          }
        } else {
          mostraStatus("Permesso per le notifiche negato.", true);
        }
      } catch (e) { 
        mostraStatus("Errore durante l'attivazione notifiche: " + e.message, true); 
      }

      aggiornaVisibilitaBottoneNotifiche();
    };

    // Nasconde il bottone se il permesso è già stato concesso o negato in precedenza
    window.aggiornaVisibilitaBottoneNotifiche = function() {
      const btn = document.getElementById("btn-notifiche");
      if (!btn) return;

      const giaAbilitateSalvato = localStorage.getItem("notificheAbilitate") === "1";
      const permessoConcesso = ("Notification" in window) && Notification.permission === "granted";
      const permessoNegato = ("Notification" in window) && Notification.permission === "denied";

      // Se il permesso risulta concesso, sincronizza sempre il flag salvato
      if (permessoConcesso) localStorage.setItem("notificheAbilitate", "1");

      // Nasconde il bottone se: già abilitato in passato su questo dispositivo,
      // oppure il permesso è già stato concesso o negato dal browser
      if (giaAbilitateSalvato || permessoConcesso || permessoNegato || !("Notification" in window)) {
        btn.style.display = "none";
      } else {
        btn.style.display = "block";
      }
    };

    // ================== ADMIN PANEL ==================
    
    window.entraPannelloAdmin = function() {
      const input = document.getElementById("admin-password-input");
      input.value = "";
      document.getElementById("modal-admin-login").style.display = "flex";
      setTimeout(() => input.focus(), 100);
    };

    window.chiudiModalAdminLogin = function() {
      document.getElementById("modal-admin-login").style.display = "none";
    };

    window.confermaPasswordAdmin = function() {
      const password = document.getElementById("admin-password-input").value;
      if (password === "admin123") { // CAMBIA QUESTA PASSWORD!
        document.getElementById("modal-admin-login").style.display = "none";
        document.getElementById("main-content").style.display = "none";
        document.getElementById("admin-panel").style.display = "block";
        caricaProdottiAdmin();
      } else {
        mostraStatus("Password errata!", true);
      }
    };

    window.esciPannelloAdmin = function() {
      document.getElementById("main-content").style.display = "block";
      document.getElementById("admin-panel").style.display = "none";
    };

    window.caricaProdottiAdmin = async function() {
      try {
        const docs = await getDocs(collection(db, "prodotti"));
        const prodotti = [];
        docs.forEach(d => {
          if (d.id !== "_config") {
            prodotti.push({ id: d.id, ...d.data() });
          }
        });

        let html = '<h3>Prodotti Attuali</h3>';
        if (prodotti.length === 0) {
          html += '<p>Nessun prodotto trovato. Aggiungine uno qui sotto.</p>';
        } else {
          html += '<div class="table-wrapper"><table class="admin-table"><tr><th>Nome</th><th>Giacenza</th><th>Aggiungi/Togli scorta</th><th>Prezzo (€)</th><th>Ordini</th><th>Ordine Vis.</th><th>Azioni</th></tr>';
          prodotti.forEach((p, idx) => {
            html += `<tr>
              <td>${p.tipo}</td>
              <td id="giacenza-attuale-${p.id}">${p.giacenza}</td>
              <td>
                <input type="number" id="scorta-${p.id}" placeholder="es: 20 o -5" style="width:80px;">
                <button class="btn-secondary" style="width:auto; padding:6px 10px;" onclick="aggiungiScortaAdmin('${p.id}', '${p.tipo.replace(/'/g, "\\'")}')">OK</button>
              </td>
              <td><input type="number" id="prezzo-${p.id}" value="${p.prezzo || 0}" min="0" step="0.5" style="width:70px;"></td>
              <td>${p.ordinati || 0}</td>
              <td><input type="number" id="sort-${p.id}" value="${idx}" min="0" style="width:60px;"></td>
              <td><button class="btn-secondary" onclick="eliminaProdottoAdmin('${p.id}')">Elimina</button></td>
            </tr>`;
          });
          html += '</table></div>';
        }

        html += `<h3 style="margin-top:2rem;">Aggiungi Nuovo Prodotto</h3>
          <div class="prod-input-group">
            <label>Nome Prodotto:</label>
            <input type="text" id="new-prod-name" placeholder="Es: Colombe Pistacchio">
            <label>Giacenza Iniziale:</label>
            <input type="number" id="new-prod-qta" min="0" value="10">
            <label>Prezzo (€):</label>
            <input type="number" id="new-prod-prezzo" min="0" step="0.5" value="0">
            <button onclick="aggiungiProdottoAdmin()" style="width:auto; margin-top:1rem;">Aggiungi Prodotto</button>
          </div>`;

        html += `<h3 style="margin-top:2rem;">Salva Ordine Visualizzazione e Prezzi</h3>
          <p>Modifica i numeri nella tabella sopra (ordine e/o prezzo) e clicca qui per salvare:</p>
          <button onclick="salvaOrdineAdmin()" class="btn-dark" style="width:auto; margin-top:1rem;">💾 Salva Ordine e Prezzi</button>`;

        html += `<h3 style="margin-top:2rem;">Riepilogo Ordini per Famiglia</h3>
          <p>Vedi tutti gli ordini raggruppati per famiglia/padrino, con prodotti, quantità e totale — pronto per la stampa in PDF.</p>
          <button onclick="mostraRiepilogoFamiglieAdmin()" class="btn-dark" style="width:auto; margin-top:1rem;">📋 Apri Riepilogo per Famiglia</button>`;

        html += `<h3 style="margin-top:2rem;">Reset Completo</h3>
          <p style="color:#d32f2f; font-weight:bold;">⚠️ Questa azione eliminerà TUTTI i dati (prodotti e prenotazioni)!</p>
          <button onclick="resetCompletoAdmin()" class="btn-warning" style="width:auto; margin-top:1rem;">🗑️ Reset Completo</button>`;

        document.getElementById("admin-content").innerHTML = html;
      } catch(e) {
        mostraStatus("Errore caricamento admin: " + e.message, true);
      }
    };

    window.aggiungiProdottoAdmin = async function() {
      const nome = document.getElementById("new-prod-name").value.trim();
      const qta = parseInt(document.getElementById("new-prod-qta").value) || 0;
      const prezzo = parseFloat(document.getElementById("new-prod-prezzo").value) || 0;

      if (!nome) return mostraStatus("Inserisci il nome del prodotto!", true);

      try {
        let newId = nome
          .trim()
          .toLowerCase()
          .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // rimuove accenti
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
        if (!newId) newId = `prod_${Date.now()}`;

        // Se esiste già un prodotto con questo ID, aggiunge un suffisso per evitare conflitti
        const esistente = await getDoc(doc(db, "prodotti", newId));
        if (esistente.exists()) {
          newId = `${newId}-${Date.now()}`;
        }

        await setDoc(doc(db, "prodotti", newId), {
          tipo: nome,
          giacenza: qta,
          prezzo: prezzo,
          ordinati: 0
        });
        mostraStatus("Prodotto aggiunto!");
        document.getElementById("new-prod-name").value = "";
        document.getElementById("new-prod-qta").value = "10";
        document.getElementById("new-prod-prezzo").value = "0";
        caricaProdottiAdmin();
      } catch(e) {
        mostraStatus("Errore: " + e.message, true);
      }
    };

    window.aggiungiScortaAdmin = async function(id, nomeProdotto) {
      const input = document.getElementById(`scorta-${id}`);
      const delta = parseInt(input.value) || 0;
      if (delta === 0) return mostraStatus("Inserisci una quantità diversa da zero (es: 20 per aggiungere, -5 per togliere).", true);

      try {
        const ref = doc(db, "prodotti", id);
        const snap = await getDoc(ref);
        if (!snap.exists()) return mostraStatus("Prodotto non trovato.", true);

        const vecchia = snap.data().giacenza || 0;
        const nuova = vecchia + delta;
        if (nuova < 0) return mostraStatus(`Non puoi togliere ${Math.abs(delta)}: ci sono solo ${vecchia} pezzi.`, true);

        await setDoc(ref, { giacenza: nuova }, { merge: true });
        input.value = "";
        mostraStatus(`Giacenza aggiornata: ${vecchia} → ${nuova}`);

        // Se la modifica è una diminuzione che attraversa una soglia, notifica comunque
        const notif = calcolaNotificaGiacenza(nomeProdotto, vecchia, nuova);
        if (notif) inviaPushNotifica(notif.titolo, notif.corpo);

        caricaProdottiAdmin();
      } catch(e) {
        mostraStatus("Errore: " + e.message, true);
      }
    };

    window.eliminaProdottoAdmin = async function(id) {
      if (confirm("Sei sicuro di voler eliminare questo prodotto?")) {
        try {
          await deleteDoc(doc(db, "prodotti", id));
          mostraStatus("Prodotto eliminato!");
          caricaProdottiAdmin();
        } catch(e) {
          mostraStatus("Errore: " + e.message, true);
        }
      }
    };

    // RIEPILOGO ORDINI PER FAMIGLIA (PADRINI) - stampabile in PDF
    window.mostraRiepilogoFamiglieAdmin = async function() {
      try {
        const snapshot = await getDocs(collection(db, "prenotazioni"));

        // Raggruppa per famiglia -> prodotto -> quantità totale
        const famiglie = {};
        snapshot.forEach(d => {
          const dati = d.data();
          const fam = dati.nome || "Sconosciuto";
          if (!famiglie[fam]) famiglie[fam] = {};
          famiglie[fam][dati.prodotto] = (famiglie[fam][dati.prodotto] || 0) + dati.quantita;
        });

        const nomiFamiglie = Object.keys(famiglie).sort((a, b) => a.localeCompare(b));

        let html = `<p style="text-align:center; color:#666; margin-bottom:20px;">Generato il ${new Date().toLocaleDateString('it-IT')}</p>`;

        if (nomiFamiglie.length === 0) {
          html += "<p>Nessun ordine trovato.</p>";
        } else {
          nomiFamiglie.forEach(fam => {
            const prodotti = Object.entries(famiglie[fam]).filter(([_, qta]) => qta > 0);
            if (prodotti.length === 0) return;

            let totQuantita = 0;
            let totSoldi = 0;

            html += `<div class="card-persona famiglia-stampa">
                       <h4>👤 ${fam}</h4>
                       <div class="table-wrapper"><table style="width:100%;">
                         <tr style="font-size:0.72rem; background:#f0f0f0;">
                           <th style="text-align:left; color:black; background:#eee;">Prodotto</th>
                           <th style="color:black; background:#eee;">Quantità</th>
                           <th style="color:black; background:#eee;">Consegnati</th>
                           <th style="color:black; background:#eee;">Etich. Panettone</th>
                           <th style="color:black; background:#eee;">Creme</th>
                           <th style="color:black; background:#eee;">Etich. Vasetti</th>
                         </tr>`;

            prodotti.forEach(([prod, qta]) => {
              totQuantita += qta;
              totSoldi += qta * window.getPrezzo(prod);
              html += `<tr>
                         <td style="text-align:left;">${prod}</td>
                         <td style="text-align:center;">${qta}</td>
                         <td style="text-align:center; border-bottom:1px solid #999;">&nbsp;</td>
                         <td style="text-align:center; border-bottom:1px solid #999;">&nbsp;</td>
                         <td style="text-align:center; border-bottom:1px solid #999;">&nbsp;</td>
                         <td style="text-align:center; border-bottom:1px solid #999;">&nbsp;</td>
                       </tr>`;
            });

            html += `<tr style="background:#e8f5e9; font-weight:bold;">
                       <td style="text-align:left;">Totale</td>
                       <td style="text-align:center;">${totQuantita}</td>
                       <td style="text-align:center; font-weight:normal; font-size:0.68rem;">Totale scatole:</td>
                       <td style="text-align:center; font-weight:normal; font-size:0.68rem;">Totale laccetti:</td>
                       <td style="text-align:center; font-weight:normal; font-size:0.68rem;">Totale adesivi:</td>
                       <td style="text-align:center;">€ ${totSoldi.toFixed(2)}</td>
                     </tr>`;

            html += `</table></div>
                     </div>`;
          });
        }

        document.getElementById("contenuto-stampa-famiglie").innerHTML = html;
        document.getElementById("modal-riepilogo-famiglie").style.display = "flex";
      } catch(e) {
        mostraStatus("Errore caricamento riepilogo: " + e.message, true);
      }
    };

    window.salvaOrdineAdmin = async function() {
      try {
        const inputs = document.querySelectorAll("[id^='sort-']");
        const ordine = [];
        inputs.forEach(inp => {
          const id = inp.id.replace("sort-", "");
          ordine[parseInt(inp.value)] = id;
        });

        await setDoc(doc(db, "prodotti", "_config"), {
          ordine: ordine.filter(x => x)
        });

        // Salva anche i prezzi modificati per ciascun prodotto
        const prezzoInputs = document.querySelectorAll("[id^='prezzo-']");
        for (const inp of prezzoInputs) {
          const id = inp.id.replace("prezzo-", "");
          const prezzo = parseFloat(inp.value) || 0;
          await setDoc(doc(db, "prodotti", id), { prezzo: prezzo }, { merge: true });
        }

        mostraStatus("Ordine e prezzi salvati!");
      } catch(e) {
        mostraStatus("Errore: " + e.message, true);
      }
    };

    window.resetCompletoAdmin = async function() {
      if (!confirm("⚠️ ATTENZIONE! Eliminerai TUTTI i dati. Sei VERAMENTE sicuro?")) return;
      if (!confirm("Ultima conferma: elimino VERAMENTE tutto?")) return;

      try {
        // Elimina tutti i prodotti
        const prodDocs = await getDocs(collection(db, "prodotti"));
        for (const d of prodDocs.docs) {
          await deleteDoc(d.ref);
        }

        // Elimina tutte le prenotazioni
        const prenDocs = await getDocs(collection(db, "prenotazioni"));
        for (const d of prenDocs.docs) {
          await deleteDoc(d.ref);
        }

        mostraStatus("Database completamente resettato!");
        setTimeout(() => caricaProdottiAdmin(), 1000);
      } catch(e) {
        mostraStatus("Errore: " + e.message, true);
      }
    };

  </script>
</head>
<body>

<!-- MAIN CONTENT -->

<script>
  // Ripristina l'ultima famiglia selezionata
  const fav = localStorage.getItem("famiglia");
  if (fav) document.getElementById("nome").value = fav;

  // IMPORTANTE: lo script Firebase in cima alla pagina è "type=module", quindi viene
  // eseguito in differita (dopo il parsing di tutta la pagina). Questo script invece
  // è uno script normale e verrebbe eseguito SUBITO, cioè PRIMA che il modulo abbia
  // definito aggiornaVisibilitaBottoneNotifiche() - la chiamata fallirebbe in silenzio
  // e il bottone notifiche non verrebbe mai nascosto. Aspettiamo quindi DOMContentLoaded,
  // che scatta solo dopo che anche il modulo ha finito di essere eseguito.
  document.addEventListener('DOMContentLoaded', function() {
    if (window.aggiornaVisibilitaBottoneNotifiche) {
      window.aggiornaVisibilitaBottoneNotifiche();
    }
  });

  // Funzione intelligente per leggere quantità e nomi multipli dalla nota
  function capitalizzaNome(str) {
    return str
      .trim()
      .split(/\s+/)
      .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
      .join(" ");
  }

  function analizzaNotaEQuantita(qtaTotaleInserita, notaTesto) {
    let testo = notaTesto.trim().replace(/,/g, ' ');
    // Separa i numeri "attaccati" al nome, es: "2luca" -> "2 luca"
    testo = testo.replace(/(\d+)(?=[^\s\d])/g, '$1 ');
    const tokens = testo.split(/\s+/).filter(t => t !== "");

    if (tokens.length === 0) {
      return { errore: "Inserisci un nome nella nota." };
    }

    const contieneNumeri = tokens.some(t => /^\d+$/.test(t));

    // Nessun numero nella nota: tutta la quantità inserita va al nome scritto (anche più parole)
    if (!contieneNumeri) {
      return { risultati: [{ quantita: qtaTotaleInserita, nota: capitalizzaNome(testo) }] };
    }

    // Con i numeri il formato è: <numero> <nome, anche di più parole> <numero> <nome> ...
    // Solo il testo PRIMA del primo numero è ambiguo: non sappiamo a chi assegnarlo.
    if (!/^\d+$/.test(tokens[0])) {
      const parolePrimaDelNumero = [];
      let k = 0;
      while (k < tokens.length && !/^\d+$/.test(tokens[k])) { parolePrimaDelNumero.push(tokens[k]); k++; }
      const testoAmbiguo = parolePrimaDelNumero.join(" ");
      return { errore: `Specifica un numero prima di "${capitalizzaNome(testoAmbiguo)}" (es: "3 ${testoAmbiguo}").` };
    }

    const risultati = [];
    let correnteQta = null;
    let correnteNome = [];
    let erroreNomeMancante = null;

    const chiudiGruppo = () => {
      if (correnteQta === null) return;
      const nome = correnteNome.join(" ").trim();
      if (!nome) {
        erroreNomeMancante = `Manca il nome dopo il numero ${correnteQta}.`;
        return;
      }
      risultati.push({ quantita: parseInt(correnteQta), nota: capitalizzaNome(nome) });
    };

    for (const token of tokens) {
      if (erroreNomeMancante) break;
      if (/^\d+$/.test(token)) {
        chiudiGruppo();
        correnteQta = token;
        correnteNome = [];
      } else {
        correnteNome.push(token);
      }
    }
    if (!erroreNomeMancante) chiudiGruppo();

    if (erroreNomeMancante) {
      return { errore: erroreNomeMancante };
    }

    const somma = risultati.reduce((acc, r) => acc + r.quantita, 0);
    if (somma !== qtaTotaleInserita) {
      return { errore: `La somma nella nota (${somma}) non coincide con la quantità inserita (${qtaTotaleInserita}). Correggi uno dei due valori.` };
    }

    return { risultati };
  }

  function confermaOrdine() {
    const nomeFamiglia = document.getElementById("nome").value;
    if (!nomeFamiglia) return mostraStatus("Seleziona la famiglia!", true);

    const ordine = [];
    let erroreInput = false;

    document.querySelectorAll("[id^='qta-']").forEach(input => {
      if (erroreInput) return;
      const id = input.id.replace("qta-", "");
      const qDefault = parseInt(input.value) || 0;
      const nTesto = document.getElementById(`nota-${id}`)?.value.trim() || "";
      const pNome = input.parentElement.parentElement.querySelector(".col-prod").innerText;

      if (qDefault > 0 || nTesto !== "") {
        if (qDefault <= 0) {
          mostraStatus(`Inserisci la quantità per ${pNome}.`, true);
          erroreInput = true;
          return;
        }
        if (!nTesto) {
          mostraStatus(`Inserisci una nota (Chi?) per ${pNome}`, true);
          erroreInput = true;
          return;
        }

        const esito = analizzaNotaEQuantita(qDefault, nTesto);

        if (esito.errore) {
          mostraStatus(`${pNome}: ${esito.errore}`, true);
          erroreInput = true;
          return;
        }

        for (const sub of esito.risultati) {
          if (sub.quantita > 0 && sub.nota) {
            ordine.push({ 
              nome: nomeFamiglia, 
              prodottoId: id, 
              prodotto: pNome, 
              quantita: sub.quantita, 
              nota: sub.nota 
            });
          }
        }
      }
    });

    if (erroreInput) return;
    if (ordine.length === 0) return mostraStatus("Nessun prodotto selezionato.", true);

    window.payloadTemporaneo = ordine;
    let text = `Nuova Prenotazione:\n`;
    ordine.forEach(o => text += `• ${o.prodotto}: ${o.quantita} (${o.nota})\n`);

    document.getElementById("titoloModal").innerText = "Conferma Ordine";
    document.getElementById("riepilogoCorpo").innerText = text;
    document.getElementById("modal").style.display = "flex";
  }

  function preparaModificaDettaglio() {
    const fam = document.getElementById("nome").value;
    const modifiche = [];
    let riepilogoTesto = `⚠️ MODIFICA RICHIESTA\n\n`;
    let erroreValidazione = false;

    document.querySelectorAll(".card-persona").forEach(card => {
        if (erroreValidazione) return;
        const inAdds = card.querySelectorAll(".in-add");
        const inSubs = card.querySelectorAll(".in-sub");

        inAdds.forEach((el, i) => {
            if (erroreValidazione) return;
            const add = parseInt(el.value) || 0;
            const sub = parseInt(inSubs[i].value) || 0;
            const disponibile = parseInt(inSubs[i].dataset.current) || 0;
            const prod = el.dataset.prod;
            const pers = el.dataset.pers;

            if (sub > disponibile) {
                mostraStatus(`Non puoi togliere ${sub} ${prod} a ${pers}: ne ha solo ${disponibile}.`, true);
                erroreValidazione = true;
                return;
            }

            const netto = add - sub;

            if (netto !== 0) {
                const pId = el.dataset.id;
                modifiche.push({ nome: fam, prodottoId: pId, prodotto: prod, quantita: netto, nota: pers });
                riepilogoTesto += `• ${pers} | ${prod}: ${netto > 0 ? '+' : ''}${netto}\n`;
            }
        });
    });

    if (erroreValidazione) return;
    if (modifiche.length === 0) return mostraStatus("Nessuna modifica inserita.", true);

    document.getElementById("modal-dettaglio-persone").style.display = "none";
    window.payloadTemporaneo = modifiche;
    document.getElementById("titoloModal").innerText = "Conferma Modifiche";
    document.getElementById("riepilogoCorpo").innerText = riepilogoTesto;
    document.getElementById("modal").style.display = "flex";
  }
</script>
