<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e7d32">
  <title>Ordini Post - Prenotazioni</title>
  <style>
    /* STILI ORIGINALI APP */
    body {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(to right, #e8f5e9, #c8e6c9);
      margin: 0;
      padding: 1rem;
      color: #2e7d32;
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    header img { width: 60px; height: 60px; object-fit: contain; }
    h2 { margin: 0; font-size: 1.5rem; color: #2e7d32; }

    select, input[type="number"], input[type="text"], input[type="password"], button {
      width: 100%;
      padding: 0.8rem;
      margin-top: 0.5rem;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #a5d6a7;
      box-sizing: border-box;
    }

    label { font-weight: bold; color: #2e7d32; display: block; margin-top: 1rem; }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin-top: 1rem;
      border-radius: 8px;
      background-color: white;
      box-shadow: 0 2px 8px rgba(0, 128, 0, 0.15);
    }

    table { width: 100%; border-collapse: collapse; table-layout: fixed; }

    th, td {
      padding: 0.8rem 0.4rem;
      text-align: center;
      border-bottom: 1px solid #e0f2f1;
      word-wrap: break-word;
      font-size: 0.9rem;
    }

    th { background-color: #a5d6a7; color: white; font-weight: 600; }

    .col-prod { width: 30%; text-align: left; padding-left: 10px; color: #2e7d32; font-weight: bold; }
    .col-disp { width: 15%; }
    .col-qta { width: 20%; }
    .col-nota { width: 35%; }

    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); display: none; justify-content: center;
      align-items: center; z-index: 30000; overflow-y: auto;
    }

    .modal-content-box {
      background: white; padding: 20px; border-radius: 12px;
      width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 10px 25px rgba(0,128,0,0.2); margin: 20px auto;
    }

    #status-message {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%); padding: 20px 40px;
      border-radius: 15px; color: white; font-weight: bold;
      font-size: 1.2rem; text-align: center; z-index: 60000;
      display: none; box-shadow: 0 10px 30px rgba(0,128,0,0.3);
      max-width: 90vw;
    }

    .status-success { background-color: #2e7d32; }
    .status-error { background-color: #d32f2f; }

    .card-persona { border: 1px solid #c8e6c9; border-radius: 10px; padding: 10px; margin-bottom: 15px; background-color: #fafafa; }
    .card-persona h4 { margin: 0 0 10px 0; color: #2e7d32; border-bottom: 2px solid #2e7d32; padding-bottom: 5px; }

    button { background-color: #2e7d32; color: white; border: none; font-weight: bold; margin-top: 1rem; cursor: pointer; transition: background 0.3s; }
    button:hover { background-color: #1b5e20; }
    .btn-secondary { background-color: #6c757d; }
    .btn-dark { background-color: #1b5e20; }
    .btn-warning { background-color: #ff9800; }
    .admin-btn { background-color: transparent; border: 1px solid #2e7d32; color: #2e7d32; margin-top: 1.5rem; }

    /* STILI ADMIN PANEL */
    .prod-input-group {
      background: #f5f5f5;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .prod-input-group label { margin-top: 0; font-size: 0.95rem; }
    .prod-input-group input { margin-top: 0.3rem; }

    .nota-admin { font-size: 0.82rem; color: #555; margin: 0.4rem 0 0 0; }
    .bloccata { color: #d32f2f; font-weight: bold; font-size: 0.85rem; }

    /* TABELLA ADMIN - ottimizzata per smartphone (colonne a misura di contenuto + scroll orizzontale) */
    .admin-table { table-layout: auto; }
    .admin-table th, .admin-table td {
      white-space: nowrap;
      padding: 0.6rem 0.5rem;
      font-size: 0.9rem;
    }
    .admin-table input {
      width: 72px;
      min-width: 60px;
      padding: 0.45rem;
      font-size: 0.9rem;
      margin-top: 0;
    }
    .admin-table button {
      width: auto;
      margin-top: 0;
      padding: 0.5rem 0.7rem;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      body { padding: 0.5rem; }
      #admin-content { padding: 12px !important; }
      .admin-table th, .admin-table td {
        font-size: 0.78rem;
        padding: 0.45rem 0.35rem;
      }
      .admin-table input {
        width: 55px;
        min-width: 48px;
        font-size: 0.78rem;
        padding: 0.35rem;
      }
      .admin-table button {
        font-size: 0.75rem;
        padding: 0.4rem 0.5rem;
      }
      .prod-input-group input { font-size: 0.9rem; }
    }
  </style>
  <style media="print">
    body * { visibility: hidden; }
    #contenuto-stampa-famiglie, #contenuto-stampa-famiglie * { visibility: visible; }

    /* Il modal è "position: fixed" a schermo intero: in stampa questo genera pagine
       duplicate/vuote. Lo riportiamo al flusso normale del documento. */

      position: static !important;
      display: block !important;
      background: none !important;
      width: auto !important;

    #modal-riepilogo-famiglie .modal-content-box {

  <!-- TUTTA LA LOGICA È IN UN UNICO MODULO (Firebase v10 modulare) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getFirestore, collection, onSnapshot, doc, getDoc, runTransaction, getDocs,
      query, where, limit, serverTimestamp, setDoc, deleteDoc, writeBatch
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

    // ⚙️ CONFIGURAZIONE FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyAY8l_GGRWPWi5BFpirUMXd2JN0MVZZpYM",
      authDomain: "ordinipost-fcc7f.firebaseapp.com",
      projectId: "ordinipost-fcc7f",
      storageBucket: "ordinipost-fcc7f.firebasestorage.app",
      messagingSenderId: "363847145933",
      appId: "1:363847145933:web:d1590848833eb147590c84",
      measurementId: "G-V50YGPTVM4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Elenco di partenza delle famiglie: viene caricato nel database una sola volta
    // (al primo avvio con la collezione "famiglie" vuota). Poi si gestisce dal pannello Admin.
    const FAMIGLIE_DEFAULT = [
      "Carapezza", "Caruso", "Di Maria", "Marino", "Massimino", "Milanese", "Murabito", "Nicosia",
      "Pantellaro", "Porto", "Romano", "Ruiz", "Scala", "Tanasi", "Zammillo"
    ];

    // ============ UTILITÀ ============
    // Escape HTML: evita che note/nomi con caratteri speciali rompano la pagina o eseguano codice
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
    window.esc = esc;

    const euro = (n) => "€ " + Number(n || 0).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function slug(testo) {
      const r = String(testo).trim().toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
      return r || `id-${Date.now()}`;
    }

    function capitalizzaNome(str) {
      return str
        .trim()
        .split(/\s+/)
        .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
        .join(" ");
    }

    // Chiave di raggruppamento "persona" (stessa logica ovunque)
    const chiavePersona = (nota) => {
      const n = String(nota || "").trim().replace(/\s+/g, " ").toLowerCase();
      return n || "generale";
    };

    // Messaggio di stato: il timer precedente viene annullato, così un messaggio
    // nuovo non sparisce prima del tempo a causa del timeout di quello vecchio.
    let statusTimer = null;
    window.mostraStatus = function(messaggio, isError = false) {
      const statusBox = document.getElementById("status-message");
      statusBox.innerText = (isError ? "❌ " : "✅ ") + messaggio;
      statusBox.className = isError ? "status-error" : "status-success";
      statusBox.style.display = "block";
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => statusBox.style.display = "none", isError ? 4500 : 2500);
    };
    const mostraStatus = window.mostraStatus;

    // ============ SERVICE WORKER E NOTIFICHE ============
    let messaging = null;
    let serviceWorkerReady = false;
    let swRegistration = null;

    async function setupServiceWorker() {
      try {
        if (!('serviceWorker' in navigator)) {
          console.log('Service Worker non supportati');
          return;
        }

        await navigator.serviceWorker.register('./firebase-messaging-sw.js', { scope: '/' });
        // Aspetta che il Service Worker sia davvero ATTIVO, non solo registrato
        swRegistration = await navigator.serviceWorker.ready;
        serviceWorkerReady = true;

        try {
          messaging = getMessaging(app);
          onMessage(messaging, (payload) => {
            mostraStatus(`🔔 ${payload.data?.title || "Notifica"}: ${payload.data?.body || ""}`);
          });
        } catch (e) {
          console.error('Errore inizializzazione messaging:', e);
        }
      } catch (e) {
        console.error('Errore registrazione Service Worker:', e);
      }
    }
    window.addEventListener('load', setupServiceWorker);

    // ============ PRODOTTI (ascolto in tempo reale) ============
    let prodottiGlobal = []; // solo prodotti veri, già ordinati (senza il documento _config)

    // Prezzo letto dal prodotto nel database. Si preferisce l'id, con ripiego sul nome.
    window.getPrezzo = (nomeProdotto, idProdotto) => {
      let pObj = idProdotto ? prodottiGlobal.find(x => x.id === idProdotto) : null;
      if (!pObj) pObj = prodottiGlobal.find(x => x.tipo === nomeProdotto);
      return pObj && pObj.prezzo ? Number(pObj.prezzo) : 0;
    };

    function ordinaProdotti(lista, ordineArray) {
      if (!Array.isArray(ordineArray)) return lista;
      return lista.sort((a, b) => {
        const idxA = ordineArray.indexOf(a.id);
        const idxB = ordineArray.indexOf(b.id);
        return (idxA === -1 ? 9999 : idxA) - (idxB === -1 ? 9999 : idxB);
      });
    }

    onSnapshot(collection(db, "prodotti"), (snapshot) => {
      const config = snapshot.docs.find(d => d.id === "_config")?.data();
      const lista = snapshot.docs
        .filter(d => d.id !== "_config")
        .map(d => ({ id: d.id, ...d.data() }));
      prodottiGlobal = ordinaProdotti(lista, config?.ordine);
      renderizzaTabellaPrincipale();
    });

    function renderizzaTabellaPrincipale() {
      const contenitore = document.getElementById("lista-prodotti");

      // Salva quanto l'utente ha già digitato (e il campo attivo) perché la tabella
      // viene ricostruita a ogni variazione di giacenza, anche causata da altri utenti.
      const salvati = {};
      contenitore.querySelectorAll("input").forEach(i => { if (i.id) salvati[i.id] = i.value; });
      const attivo = document.activeElement;
      const idAttivo = (attivo && contenitore.contains(attivo)) ? attivo.id : null;
      let selInizio = null, selFine = null;
      try { if (idAttivo) { selInizio = attivo.selectionStart; selFine = attivo.selectionEnd; } } catch (e) {}

      if (prodottiGlobal.length === 0) {
        contenitore.innerHTML = "<p>Nessun prodotto disponibile.</p>";
        return;
      }

      let html = `<div class="table-wrapper"><table><thead><tr><th class="col-prod">Prodotto</th><th class="col-disp">Disp.</th><th class="col-qta">Qtà</th><th class="col-nota">Nota</th></tr></thead><tbody>`;

      prodottiGlobal.forEach((p) => {
        const giacenza = Number(p.giacenza) || 0;
        const isEsaurito = giacenza <= 0;
        const isWarning = !isEsaurito && giacenza <= 5;

        html += `<tr style="${isEsaurito ? 'background-color: #f9f9f9; color: #999;' : isWarning ? 'background-color: #fff3e0;' : ''}">
                  <td class="col-prod">${esc(p.tipo)}</td>
                  <td class="col-disp">${giacenza}</td>
                  <td class="col-qta">
                    ${!isEsaurito
                      ? `<input type="number" id="qta-${esc(p.id)}" min="0" max="${giacenza}" placeholder="0">`
                      : `<span style="color:#d32f2f; font-weight:bold; font-size:0.8rem;">SOLD OUT</span>`
                    }
                  </td>
                  <td class="col-nota">
                    <input type="text" id="nota-${esc(p.id)}" placeholder="${isEsaurito ? '' : 'Es: 1 Mario 2 Pippo'}" ${isEsaurito ? 'disabled style="background:#f2f2f2; border:none;"' : ''}>
                  </td>
                 </tr>`;
      });

      html += `</tbody></table></div>`;
      contenitore.innerHTML = html;

      // Ripristina i valori digitati e il focus
      Object.entries(salvati).forEach(([id, v]) => {
        const el = document.getElementById(id);
        if (el && v !== "") el.value = v;
      });
      if (idAttivo) {
        const el = document.getElementById(idAttivo);
        if (el) {
          el.focus();
          try { if (selInizio !== null) el.setSelectionRange(selInizio, selFine); } catch (e) {}
        }
      }
    }

    // ============ FAMIGLIE (ascolto in tempo reale) ============
    let famiglieGlobal = []; // [{id, nome}]
    let seedControllato = false;

    onSnapshot(collection(db, "famiglie"), (snap) => {
      famiglieGlobal = snap.docs
        .map(d => ({ id: d.id, nome: d.data().nome || d.id }))
        .sort((a, b) => a.nome.localeCompare(b.nome, 'it'));
      renderSelectFamiglie();

      if (snap.empty && !seedControllato) {
        seedControllato = true;
        caricaFamiglieDefaultSeNecessario();
      }
    });

    function renderSelectFamiglie() {
      const sel = document.getElementById("nome");
      const corrente = sel.value || localStorage.getItem("famiglia") || "";
      let html = '<option value="">-- Seleziona --</option>';
      famiglieGlobal.forEach(f => { html += `<option value="${esc(f.nome)}">${esc(f.nome)}</option>`; });
      sel.innerHTML = html;
      sel.value = famiglieGlobal.some(f => f.nome === corrente) ? corrente : "";
    }

    // Carica l'elenco predefinito UNA sola volta (flag in meta/famiglie_init):
    // se poi elimini tutte le famiglie, l'elenco non riappare da solo.
    async function caricaFamiglieDefaultSeNecessario() {
      try {
        const metaRef = doc(db, "meta", "famiglie_init");
        const meta = await getDoc(metaRef);
        if (meta.exists()) return;
        const batch = writeBatch(db);
        FAMIGLIE_DEFAULT.forEach(n => batch.set(doc(db, "famiglie", slug(n)), { nome: n }));
        batch.set(metaRef, { fatto: true, data: serverTimestamp() });
        await batch.commit();
      } catch (e) {
        console.error("Errore caricamento famiglie predefinite:", e);
      }
    }

    // ============ NOTIFICHE DI GIACENZA ============
    // Le soglie 25 e 15 avvisano solo quando vengono "attraversate" scendendo.
    // Da 10 in giù avvisa ad OGNI diminuzione.
    function calcolaNotificaGiacenza(nomeProdotto, vecchia, nuova) {
      if (nuova >= vecchia) return null; // nessuna diminuzione, nessuna notifica

      if (nuova <= 0) {
        return { titolo: `Prodotto Esaurito: ${nomeProdotto}`, corpo: `${nomeProdotto} non è più disponibile!` };
      }
      if (nuova <= 10) {
        return { titolo: `⚠️ Solo ${nuova} pezzi rimasti!`, corpo: `${nomeProdotto} sta per terminare!` };
      }
      if (vecchia >= 15 && nuova < 15) {
        return { titolo: `⚠️ ${nomeProdotto} sotto i 15 pezzi`, corpo: `Rimasti ${nuova} pezzi.` };
      }
      if (vecchia >= 25 && nuova < 25) {
        return { titolo: `⚠️ ${nomeProdotto} sotto i 25 pezzi`, corpo: `Rimasti ${nuova} pezzi.` };
      }
      return null;
    }

    window.inviaPushNotifica = async function(titolo, corpo) {
      try {
        const risposta = await fetch('/.netlify/functions/notify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            secret: 'k9Xz2mQ7pL4wR8vT1nC6bY3',
            title: titolo,
            body: corpo
          })
        });
        const dati = await risposta.json();
        console.log(`📢 Notifica inviata: ${titolo} - ${corpo}`, dati);
      } catch (e) {
        console.error('Errore invio notifica:', e);
      }
    };

    // ============ PARSING NOTA / QUANTITÀ ============
    function analizzaNotaEQuantita(qtaTotaleInserita, notaTesto) {
      let testo = notaTesto.trim().replace(/,/g, ' ');
      // Separa i numeri "attaccati" al nome, es: "2luca" -> "2 luca"
      testo = testo.replace(/(\d+)(?=[^\s\d])/g, '$1 ');
      const tokens = testo.split(/\s+/).filter(t => t !== "");

      if (tokens.length === 0) {
        return { errore: "Inserisci un nome nella nota." };
      }

      const contieneNumeri = tokens.some(t => /^\d+$/.test(t));

      // Nessun numero nella nota: tutta la quantità inserita va al nome scritto (anche più parole)
      if (!contieneNumeri) {
        return { risultati: [{ quantita: qtaTotaleInserita, nota: capitalizzaNome(testo) }] };
      }

      // Con i numeri il formato è: <numero> <nome, anche di più parole> <numero> <nome> ...
      if (!/^\d+$/.test(tokens[0])) {
        const parolePrimaDelNumero = [];
        let k = 0;
        while (k < tokens.length && !/^\d+$/.test(tokens[k])) { parolePrimaDelNumero.push(tokens[k]); k++; }
        const testoAmbiguo = parolePrimaDelNumero.join(" ");
        return { errore: `Specifica un numero prima di "${capitalizzaNome(testoAmbiguo)}" (es: "3 ${testoAmbiguo}").` };
      }

      const risultati = [];
      let correnteQta = null;
      let correnteNome = [];
      let erroreNomeMancante = null;

      const chiudiGruppo = () => {
        if (correnteQta === null) return;
        const nome = correnteNome.join(" ").trim();
        if (!nome) {
          erroreNomeMancante = `Manca il nome dopo il numero ${correnteQta}.`;
          return;
        }
        risultati.push({ quantita: parseInt(correnteQta), nota: capitalizzaNome(nome) });
      };

      for (const token of tokens) {
        if (erroreNomeMancante) break;
        if (/^\d+$/.test(token)) {
          chiudiGruppo();
          correnteQta = token;
          correnteNome = [];
        } else {
          correnteNome.push(token);
        }
      }
      if (!erroreNomeMancante) chiudiGruppo();

      if (erroreNomeMancante) return { errore: erroreNomeMancante };

      const somma = risultati.reduce((acc, r) => acc + r.quantita, 0);
      if (somma !== qtaTotaleInserita) {
        return { errore: `La somma nella nota (${somma}) non coincide con la quantità inserita (${qtaTotaleInserita}). Correggi uno dei due valori.` };
      }

      return { risultati };
    }

    // ============ NUOVO ORDINE (validazione lato schermo) ============
    window.confermaOrdine = function() {
      const nomeFamiglia = document.getElementById("nome").value;
      if (!nomeFamiglia) return mostraStatus("Seleziona la famiglia!", true);

      const ordine = [];

      for (const p of prodottiGlobal) {
        const qInput = document.getElementById(`qta-${p.id}`);
        if (!qInput) continue; // prodotto esaurito, nessun campo

        const qta = Number(qInput.value);
        if (!Number.isSafeInteger(qta) || qta < 0) return mostraStatus("Inserisci quantità intere non negative.", true);
        const nTesto = (document.getElementById(`nota-${p.id}`)?.value || "").trim();

        if (qta <= 0 && nTesto === "") continue;
        if (qta <= 0) return mostraStatus(`Inserisci la quantità per ${p.tipo}.`, true);
        if (!nTesto) return mostraStatus(`Inserisci una nota (Chi?) per ${p.tipo}`, true);

        const giacenza = Number(p.giacenza) || 0;
        if (qta > giacenza) return mostraStatus(`${p.tipo}: ne sono rimasti solo ${giacenza}.`, true);

        const esito = analizzaNotaEQuantita(qta, nTesto);
        if (esito.errore) return mostraStatus(`${p.tipo}: ${esito.errore}`, true);

        for (const sub of esito.risultati) {
          if (sub.quantita > 0 && sub.nota) {
            ordine.push({
              nome: nomeFamiglia,
              prodottoId: p.id,
              prodotto: p.tipo,
              quantita: sub.quantita,
              nota: sub.nota
            });
          }
        }
      }

      if (ordine.length === 0) return mostraStatus("Nessun prodotto selezionato.", true);

      window.payloadTemporaneo = ordine;
      window.tipoOperazione = "ordine";
      let text = `Nuova Prenotazione (${nomeFamiglia}):\n`;

    window.preparaModificaDettaglio = function() {
      const fam = document.getElementById("nome").value;
      const modifiche = [];
      const deltaPerProdotto = {};
      let riepilogoTesto = `⚠️ MODIFICA RICHIESTA (${fam})\n\n`;

      for (const elAdd of document.querySelectorAll("#contenuto-dettaglio .in-add")) {
        const riga = elAdd.closest("tr");
        const elSub = riga.querySelector(".in-sub");
        const add = Number(elAdd.value);
        const sub = Number(elSub.value);
        if (![add, sub].every(n => Number.isSafeInteger(n) && n >= 0)) return mostraStatus("Inserisci quantità intere non negative.", true);
        const disponibile = parseInt(elSub.dataset.current) || 0;
        const prod = elAdd.dataset.prod;
        const pers = elAdd.dataset.pers;
        const pId = elAdd.dataset.id;

        if (sub > disponibile) {
          return mostraStatus(`Non puoi togliere ${sub} ${prod} a ${pers}: ne ha solo ${disponibile}.`, true);
        }

        const netto = add - sub;
        if (netto !== 0) {
          modifiche.push({ nome: fam, prodottoId: pId, prodotto: prod, quantita: netto, nota: pers });
          deltaPerProdotto[pId] = (deltaPerProdotto[pId] || 0) + netto;
          riepilogoTesto += `• ${pers} | ${prod}: ${netto > 0 ? '+' : ''}${netto}\n`;
        }
      }

      if (modifiche.length === 0) return mostraStatus("Nessuna modifica inserita.", true);

      // Controllo anticipato sulla disponibilità complessiva (quello definitivo è nella transazione)
      for (const [pId, delta] of Object.entries(deltaPerProdotto)) {
        if (delta <= 0) continue;
        const p = prodottiGlobal.find(x => x.id === pId);
        const giacenza = p ? (Number(p.giacenza) || 0) : 0;
        if (delta > giacenza) {
          return mostraStatus(`${p ? p.tipo : pId}: ne servono ${delta} in più ma ne restano solo ${giacenza}.`, true);
        }
      }

      document.getElementById("modal-dettaglio-persone").style.display = "none";
      window.payloadTemporaneo = modifiche;
      window.tipoOperazione = "modifica";
      document.getElementById("titoloModal").innerText = "Conferma Modifiche";
      document.getElementById("riepilogoCorpo").innerText = riepilogoTesto;
      document.getElementById("modal").style.display = "flex";
    };

      try {

    // Aggiunge/toglie scorta in modo ATOMICO (transazione): un ordine in arrivo nello
    // stesso istante non viene più perso. Aggiorna anche la giacenza iniziale.
    window.aggiungiScortaAdmin = async function(id) {
      const input = document.getElementById(`scorta-${id}`);
      const delta = Number(input.value);
      if (!Number.isSafeInteger(delta)) return mostraStatus("Inserisci una quantità intera.", true);
      if (delta === 0) return mostraStatus("Inserisci una quantità diversa da zero (es: 20 per aggiungere, -5 per togliere).", true);

      try {
        const ref = doc(db, "prodotti", id);
        const esito = await runTransaction(db, async (tx) => {
          const snap = await tx.get(ref);
          if (!snap.exists()) throw new Error("Prodotto non trovato.");
          const d = snap.data();
          const vecchia = Number(d.giacenza) || 0;
          const nuova = vecchia + delta;
          if (nuova < 0) throw new Error(`Non puoi togliere ${Math.abs(delta)}: ci sono solo ${vecchia} pezzi.`);
          const inizialeAttuale = (d.iniziale !== undefined && d.iniziale !== null)
            ? Number(d.iniziale)
            : vecchia + (Number(d.ordinati) || 0);
          tx.update(ref, { giacenza: nuova, iniziale: inizialeAttuale + delta });
          return { vecchia, nuova, nome: d.tipo };
        });

        mostraStatus(`Giacenza aggiornata: ${esito.vecchia} → ${esito.nuova}`);

        const notif = calcolaNotificaGiacenza(esito.nome, esito.vecchia, esito.nuova);
        if (notif) window.inviaPushNotifica(notif.titolo, notif.corpo);

        window.caricaProdottiAdmin();
      } catch (e) {
        mostraStatus("Errore: " + e.message, true);
      }
    };

    window.salvaOrdineAdmin = async function() {
      try {
        // Ordine: si ordina per numero inserito; a parità di numero resta la posizione attuale,
        // così due prodotti con lo stesso numero non si sovrascrivono più.
        const righe = [...document.querySelectorAll("[id^='sort-']")].map((inp, pos) => ({
          id: inp.id.slice("sort-".length),
          val: parseFloat(inp.value),
          pos
        }));
        righe.sort((a, b) => {
          const va = isNaN(a.val) ? 1e9 : a.val;
          const vb = isNaN(b.val) ? 1e9 : b.val;
          return (va - vb) || (a.pos - b.pos);
        });
        const ordine = righe.map(r => r.id);

        const batch = writeBatch(db);
        batch.set(doc(db, "prodotti", "_config"), { ordine });

        document.querySelectorAll("[id^='prezzo-']").forEach(inp => {
          const id = inp.id.slice("prezzo-".length);
          const prezzo = Number(inp.value);
          if (!Number.isFinite(prezzo) || prezzo < 0) throw new Error("Prezzo non valido.");
          batch.update(doc(db, "prodotti", id), { prezzo });
        });

        await batch.commit();
        mostraStatus("Ordine e prezzi salvati!");
        window.caricaProdottiAdmin();
      } catch (e) {
        mostraStatus("Errore: " + e.message, true);
      }
    };

    window.resetCompletoAdmin = async function() {
      mostraStatus("Reset disabilitato per conservare pagamenti, consegne e storico. Per una nuova campagna occorre archiviare i dati.", true);
    };

    // Tutte le operazioni nuove condividono una revisione: una lettura esterna
    // alla transazione è valida solo se nessun'altra operazione è intervenuta.
    const familyId = f => encodeURIComponent(f);
    const personKey = n => encodeURIComponent(chiavePersona(n));
    const lineKey = (n,p) => JSON.stringify([chiavePersona(n),p]);
    const statoPagamento = (pagato, totale) => pagato > totale ? `Credito ${euro((pagato-totale)/100)}` : pagato === totale && totale > 0 ? 'Saldo' : pagato > 0 ? `Acconto · residuo ${euro((totale-pagato)/100)}` : `Da pagare ${euro(totale/100)}`;
    const lockRef = () => doc(db, 'meta', 'operazioni_revision');
    async function leggiFamiglia(fam) {
      const rev = await getDoc(lockRef());
      const [rows, state] = await Promise.all([
        getDocs(query(collection(db,'prenotazioni'),where('nome','==',fam))),
        getDoc(doc(db,'gestione_famiglie',familyId(fam)))
      ]);
      const net = new Map();
      rows.forEach(d => {
        const r=d.data(), id=r.prodottoId || prodottiGlobal.find(p=>p.tipo===r.prodotto)?.id;
        if (!id) throw new Error(`Prodotto storico non riconosciuto: ${r.prodotto}.`);
        const k=lineKey(r.nota,id);
        if(!net.has(k)) net.set(k,{nome:fam,nota:r.nota || 'Generale',prodottoId:id,prodotto:r.prodotto,quantita:0});
        net.get(k).quantita += Number(r.quantita)||0;
      });
      return {version:rev.data()?.version || 0, net, persone:state.data()?.persone || {}};
    }
    async function registraOperazione(items, tipo='ordine', extra={}) {
      const fam=items[0]?.nome || extra.fam;
      if(!fam) throw new Error('Famiglia mancante.');
      const base=await leggiFamiglia(fam);
      const aggregate=new Map();
      for(const i of items){
        if(i.nome!==fam || !Number.isSafeInteger(i.quantita) || i.quantita===0) throw new Error('Quantità non valida.');
        const k=lineKey(i.nota,i.prodottoId);
        if(!aggregate.has(k)) aggregate.set(k,{...i,quantita:0});
        aggregate.get(k).quantita+=i.quantita;
      }
      const righe=[...aggregate.values()].filter(i=>i.quantita);
      if(righe.length>180) throw new Error('Troppe righe: suddividi l’operazione.');
      const opRef=doc(collection(db,'operazioni'));
      return runTransaction(db,async tx=>{
        const lock=await tx.get(lockRef());
        if((lock.data()?.version || 0)!==base.version) throw new Error('I dati sono cambiati su un altro dispositivo. Riapri e riprova.');
        const stateRef=doc(db,'gestione_famiglie',familyId(fam));
        const state=await tx.get(stateRef);
        const persone=state.data()?.persone || {};
        let origine;
        if(extra.undo){
          origine=await tx.get(doc(db,'operazioni',extra.undo));
          if(!origine.exists() || origine.data().annullata || origine.data().tipo==='annullamento') throw new Error('Operazione non annullabile.');
        }
        const products=new Map();
        const ids=new Set([...righe.map(i=>i.prodottoId), ...[...base.net.values()].filter(i=>personKey(i.nota)===personKey(extra.persona || '')).map(i=>i.prodottoId)]);
        for(const id of ids){ const snap=await tx.get(doc(db,'prodotti',id)); if(!snap.exists()) throw new Error('Prodotto eliminato: impossibile procedere.'); products.set(id,snap.data()); }
        const next=new Map([...base.net].map(([k,v])=>[k,{...v}]));
        const delta=new Map();
        for(const r of righe){
          const k=lineKey(r.nota,r.prodottoId), old=next.get(k)?.quantita || 0, q=old+r.quantita;
          if(q<0) throw new Error(`${r.nota}: impossibile togliere più pezzi di quelli ordinati.`);
          const consegnati=persone[personKey(r.nota)]?.consegne?.[r.prodottoId] || 0;
          if(q<consegnati) throw new Error(`${r.nota}: ci sono già ${consegnati} pezzi consegnati. Correggi prima la consegna.`);
          next.set(k,{...r,quantita:q}); delta.set(r.prodottoId,(delta.get(r.prodottoId)||0)+r.quantita);
        }
        if(tipo==='cancellazione') {
          for(const r of righe) if((persone[personKey(r.nota)]?.pagato || 0)>0) throw new Error('Sono presenti pagamenti: registra prima il rimborso.');
        }
        let before=null, after=null;
        if(extra.persona){
          const key=personKey(extra.persona);
          before=persone[key] || {pagato:0,consegne:{}};
          if(extra.expected && JSON.stringify(before)!==JSON.stringify(extra.expected)) throw new Error('Pagamenti o consegne cambiati: riapri il dettaglio.');
          after=extra.restore || {pagato:extra.pagato,consegne:extra.consegne};
          if(!Number.isSafeInteger(after.pagato) || after.pagato<0) throw new Error('Pagamento non valido.');
          for(const [id,q] of Object.entries(after.consegne || {})){
            if(!Number.isSafeInteger(q) || q<0 || q>(next.get(lineKey(extra.persona,id))?.quantita || 0)) throw new Error('Le consegne devono essere intere e non superare gli ordini.');
          }
          persone[key]=after;
        }
        const notifiche=[];
        for(const [id,d] of delta){
          const p=products.get(id), giacenza=Number(p.giacenza)-d, ordinati=Number(p.ordinati || 0)+d;
          if(!Number.isSafeInteger(giacenza) || giacenza<0 || !Number.isSafeInteger(ordinati) || ordinati<0) throw new Error('Giacenza o ordinati incoerenti: controllare il prodotto '+p.tipo);
          const n=calcolaNotificaGiacenza(p.tipo,Number(p.giacenza),giacenza); if(n) notifiche.push(n);
          tx.update(doc(db,'prodotti',id),{giacenza,ordinati});
        }
        for(const r of righe) tx.set(doc(collection(db,'prenotazioni')),{...r,operazioneId:opRef.id,data:serverTimestamp()});
        tx.set(stateRef,{persone});
        tx.set(lockRef(),{version:base.version+1});
        const avvisi=[];
        if(righe.some(r=>r.quantita>=20)) avvisi.push('Quantità elevata: verificare');
        if(tipo==='ordine' && righe.some(r=>(base.net.get(lineKey(r.nota,r.prodottoId))?.quantita || 0)>0)) avvisi.push('Persona/prodotto già presenti: possibile doppione');
        tx.set(opRef,{famiglia:fam,tipo,righe,persona:extra.persona || null,before,after,avvisi,annullata:false,origine:extra.undo || null,data:serverTimestamp()});
        if(extra.undo) tx.update(doc(db,'operazioni',extra.undo),{annullata:true,annullamentoId:opRef.id});
        return notifiche;
      });
    }

    let pdfPronto=null;
    window.preparaPDF=async(fam=null,persona=null)=>{
      try{
        if(!window.jspdf)throw new Error('Libreria PDF non disponibile. Verifica la connessione e ricarica.');
        const pdf=new window.jspdf.jsPDF();let y=18;
        const line=t=>{for(const l of pdf.splitTextToSize(String(t),178)){if(y>278){pdf.addPage();y=18;}pdf.text(l,16,y);y+=6;}};
        pdf.setFontSize(11);line('Riepilogo ordini · '+new Date().toLocaleString('it-IT'));line('');
        const names=fam?[fam]:[...new Set((await getDocs(collection(db,'prenotazioni'))).docs.map(d=>d.data().nome))].sort();
        let totale=0, pagamenti=0;
        for(const f of names){
          const b=await leggiFamiglia(f), people=[...new Set([...b.net.values()].map(r=>chiavePersona(r.nota)))];
          for(const name of people){
            if(persona && name!==chiavePersona(persona))continue;
            const rows=[...b.net.values()].filter(r=>chiavePersona(r.nota)===name&&r.quantita>0), g=b.persone[personKey(name)] || {pagato:0,consegne:{}};
            if(!rows.length&&!g.pagato)continue;
            line(f+' / '+capitalizzaNome(name));let sub=0;
            for(const r of rows){const prezzo=getPrezzo(r.prodotto,r.prodottoId);sub+=r.quantita*prezzo;line(`${r.prodotto}: ${r.quantita} x ${euro(prezzo)} · consegnati ${g.consegne?.[r.prodottoId] || 0} · da consegnare ${r.quantita-(g.consegne?.[r.prodottoId] || 0)}`);}
            line(`Totale ${euro(sub)} · pagato ${euro(g.pagato/100)} · ${statoPagamento(g.pagato,Math.round(sub*100))}`);line('');totale+=sub;pagamenti+=g.pagato/100;
          }
        }
        line(`TOTALE ${euro(totale)} · PAGATO ${euro(pagamenti)} · DIFFERENZA ${euro(totale-pagamenti)}`);
        pdfPronto=new File([pdf.output('blob')],`riepilogo-${slug(persona || fam || 'tutti')}.pdf`,{type:'application/pdf'});
        extraModal('PDF pronto',`<p>Il PDF contiene ordini, pagamenti e consegne. Su dispositivi compatibili scegli WhatsApp dal menu di condivisione. Altrimenti scarica il PDF e allegalo nella chat.</p><button onclick="condividiPDF()">Condividi PDF su WhatsApp</button><button onclick="scaricaPDF()">Scarica PDF</button>`);
      }catch(e){mostraStatus(e.message,true);}
    };
    window.scaricaPDF=()=>{if(!pdfPronto)return;const u=URL.createObjectURL(pdfPronto), a=document.createElement('a');a.href=u;a.download=pdfPronto.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);};
    window.condividiPDF=async()=>{
      if(!pdfPronto)return;
      try{if(navigator.canShare?.({files:[pdfPronto]}))await navigator.share({files:[pdfPronto],title:'Riepilogo ordini'});else{scaricaPDF();mostraStatus('PDF scaricato: allegalo nella chat WhatsApp.');}}catch(e){if(e.name!=='AbortError')mostraStatus('Condivisione non riuscita: usa Scarica PDF.',true);}
    };

    // ============ AVVIO ============
    // Il modulo viene eseguito a pagina già caricata: il DOM è pronto.
    window.aggiornaVisibilitaBottoneNotifiche();
  </script>
</head>
<body>

<div id="status-message"></div>

<!-- MAIN CONTENT -->
<div id="main-content">
  <header>
    <img src="logo.png" alt="Logo" onerror="this.style.display='none'"/>
    <h2>Ordini Autofinanziamento</h2>
  </header>

  <div style="max-width: 600px; margin: auto;">
      <label for="nome">👤 Famiglia Padrini:</label>
      <select id="nome" onchange="localStorage.setItem('famiglia', this.value)">
        <option value="">-- Seleziona --</option>
      </select>

      <div id="sezione-prodotti">
        <h3 style="color: #2e7d32; margin-top: 1.5rem;">📦 Disponibilità</h3>
        <div id="lista-prodotti">Caricamento disponibilità in corso...</div>
      </div>

      <button onclick="confermaOrdine()">🚀 Invia Prenotazione</button>
      <button class="btn-dark" onclick="mostraRiepilogoPrenotazioni()">📊 Visualizza Riepilogo</button>
      <button id="btn-notifiche" class="admin-btn" onclick="attivaNotifichePush()">🔔 Abilita Notifiche</button>
      <button class="btn-warning" onclick="entraPannelloAdmin()" style="margin-top:1rem;">⚙️ Pannello Admin</button>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="admin-panel" style="display:none; max-width:800px; margin:auto;">
  <header>
    <h2>⚙️ Pannello Amministrazione</h2>
  </header>
  <div id="admin-content" style="background:white; padding:20px; border-radius:8px; margin-bottom:20px;">
    Caricamento...
  </div>
  <button class="btn-secondary" onclick="esciPannelloAdmin()" style="width:100%;">← Torna Indietro</button>
</div>

<!-- MODALE LOGIN ADMIN -->
<div id="modal-admin-login" class="modal">
  <div class="modal-content-box" style="max-width: 340px;">
    <h3 style="margin-top: 0; color:#2e7d32;">🔒 Accesso Admin</h3>
    <label for="admin-password-input">Password:</label>
    <input type="password" id="admin-password-input" placeholder="Inserisci password" autocomplete="off"
           onkeydown="if(event.key==='Enter'){ event.preventDefault(); confermaPasswordAdmin(); }">
    <div style="display: flex; gap: 10px; margin-top: 20px;">
      <button onclick="confermaPasswordAdmin()" style="margin:0;">Entra</button>
      <button onclick="chiudiModalAdminLogin()" class="btn-secondary" style="margin:0;">Annulla</button>
    </div>
  </div>
</div>

<!-- MODALE CONFERMA -->
<div id="modal" class="modal">
  <div class="modal-content-box">
    <h3 id="titoloModal" style="color: #2e7d32; margin-top: 0;">Conferma Ordine</h3>
    <div id="riepilogoCorpo" style="background: #e8f5e9; padding: 10px; border-radius: 5px; font-family: monospace; white-space: pre-wrap; font-size: 0.9rem; border: 1px solid #a5d6a7;"></div>
    <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button id="btnEsegui" onclick="eseguiOperazioneBackend()" style="margin:0;">Conferma</button>
        <button onclick="document.getElementById('modal').style.display='none'" class="btn-secondary" style="margin:0;">Annulla</button>
    </div>
  </div>
</div>

<!-- MODALE RIEPILOGO -->
<div id="modal-riepilogo" class="modal">
  <div class="modal-content-box" style="max-width: 600px;">
    <h3 style="margin-top: 0; color:#2e7d32;">Riepilogo Famiglia</h3>
    <div id="contenuto-riepilogo"></div>
    <button class="btn-secondary" onclick="document.getElementById('modal-riepilogo').style.display='none'" style="margin-top:15px;">Chiudi</button>
  </div>
</div>

<!-- MODALE DETTAGLIO PERSONE -->
<div id="modal-dettaglio-persone" class="modal">
  <div class="modal-content-box" style="max-width: 650px; width: 95%;">
    <h3 style="margin-top: 0; color:#2e7d32;">Dettaglio per Persona</h3>
    <div id="contenuto-dettaglio"></div>
    <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button onclick="preparaModificaDettaglio()" style="margin:0;">Applica Modifiche</button>
        <button class="btn-secondary" onclick="document.getElementById('modal-dettaglio-persone').style.display='none'" style="margin:0;">Chiudi</button>
    </div>
  </div>
</div>

<!-- MODALE RIEPILOGO ORDINI PER FAMIGLIA (ADMIN) -->
<div id="modal-riepilogo-famiglie" class="modal">
  <div class="modal-content-box" style="max-width: 800px; width: 95%;">
    <div class="no-print" style="display:flex; justify-content: space-between; align-items:center; margin-bottom:10px;">
      <h3 style="margin:0; color:#2e7d32;">Riepilogo Ordini per Famiglia</h3>
      <div style="display:flex; gap:10px;">
        <button onclick="window.print()" style="margin:0; width:auto;">🖨️ Stampa / Salva PDF</button>
        <button class="btn-secondary" onclick="document.getElementById('modal-riepilogo-famiglie').style.display='none'" style="margin:0; width:auto;">Chiudi</button>
      </div>
    </div>
    <div id="contenuto-stampa-famiglie"></div>
  </div>
</div>

</body>
</html>
